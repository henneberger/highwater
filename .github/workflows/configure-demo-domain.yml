name: Configure demo domain

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  DISTRIBUTION_ID: E39RH62G88AJTS
  DEMO_DOMAIN: demo.highwater.cloud

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::846199521923:role/highwater-github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Configure host routing and DNS
        shell: bash
        run: |
          set -euo pipefail
          function_name=highwater-demo-router
          code_file=$(mktemp)
          cat > "${code_file}" <<'JS'
          function handler(event) {
            var request = event.request;
            if (request.headers.host && request.headers.host.value === "demo.highwater.cloud") {
              request.uri = request.uri === "/" ? "/demo/index.html" : "/demo" + request.uri;
            }
            return request;
          }
          JS

          if function_etag=$(aws cloudfront describe-function --name "${function_name}" --query ETag --output text 2>/dev/null); then
            aws cloudfront update-function \
              --name "${function_name}" \
              --if-match "${function_etag}" \
              --function-config 'Comment=Routes demo.highwater.cloud to the static console,Runtime=cloudfront-js-2.0' \
              --function-code "fileb://${code_file}" >/dev/null
          else
            aws cloudfront create-function \
              --name "${function_name}" \
              --function-config 'Comment=Routes demo.highwater.cloud to the static console,Runtime=cloudfront-js-2.0' \
              --function-code "fileb://${code_file}" >/dev/null
          fi
          function_etag=$(aws cloudfront describe-function --name "${function_name}" --query ETag --output text)
          aws cloudfront publish-function --name "${function_name}" --if-match "${function_etag}" >/dev/null
          function_arn=$(aws cloudfront describe-function --name "${function_name}" --stage LIVE --query FunctionSummary.FunctionMetadata.FunctionARN --output text)

          distribution_etag=$(aws cloudfront get-distribution-config --id "${DISTRIBUTION_ID}" --query ETag --output text)
          aws cloudfront get-distribution-config --id "${DISTRIBUTION_ID}" --query DistributionConfig > distribution.json
          certificate_arn=$(jq -r '.ViewerCertificate.ACMCertificateArn' distribution.json)
          certificate_names=$(aws acm describe-certificate --certificate-arn "${certificate_arn}" --query 'Certificate.SubjectAlternativeNames' --output text)
          if [[ " ${certificate_names} " != *" ${DEMO_DOMAIN} "* && " ${certificate_names} " != *" *.highwater.cloud "* ]]; then
            echo "The current CloudFront certificate does not cover ${DEMO_DOMAIN}" >&2
            exit 1
          fi
          existing_viewer_function=$(jq -r '.DefaultCacheBehavior.FunctionAssociations.Items // [] | map(select(.EventType == "viewer-request")) | .[0].FunctionARN // empty' distribution.json)
          if [[ -n "${existing_viewer_function}" && "${existing_viewer_function}" != "${function_arn}" ]]; then
            echo "The distribution already has a different viewer-request function" >&2
            exit 1
          fi
          jq \
            --arg domain "${DEMO_DOMAIN}" \
            --arg function_arn "${function_arn}" \
            '.Aliases.Items = ((.Aliases.Items // []) + [$domain] | unique)
             | .Aliases.Quantity = (.Aliases.Items | length)
             | .DefaultCacheBehavior.FunctionAssociations.Items = (((.DefaultCacheBehavior.FunctionAssociations.Items // []) | map(select(.EventType != "viewer-request"))) + [{"EventType":"viewer-request","FunctionARN":$function_arn}])
             | .DefaultCacheBehavior.FunctionAssociations.Quantity = (.DefaultCacheBehavior.FunctionAssociations.Items | length)' \
            distribution.json > distribution-updated.json
          aws cloudfront update-distribution \
            --id "${DISTRIBUTION_ID}" \
            --if-match "${distribution_etag}" \
            --distribution-config file://distribution-updated.json >/dev/null

          distribution_domain=$(aws cloudfront get-distribution --id "${DISTRIBUTION_ID}" --query Distribution.DomainName --output text)
          zone_id=$(aws route53 list-hosted-zones-by-name --dns-name highwater.cloud --query 'HostedZones[?Name==`highwater.cloud.`].Id | [0]' --output text)
          jq -n \
            --arg name "${DEMO_DOMAIN}" \
            --arg target "${distribution_domain}" \
            '{Changes:[
              {Action:"UPSERT",ResourceRecordSet:{Name:$name,Type:"A",AliasTarget:{HostedZoneId:"Z2FDTNDATAQYW2",DNSName:$target,EvaluateTargetHealth:false}}},
              {Action:"UPSERT",ResourceRecordSet:{Name:$name,Type:"AAAA",AliasTarget:{HostedZoneId:"Z2FDTNDATAQYW2",DNSName:$target,EvaluateTargetHealth:false}}}
            ]}' > dns-change.json
          aws route53 change-resource-record-sets \
            --hosted-zone-id "${zone_id}" \
            --change-batch file://dns-change.json >/dev/null
