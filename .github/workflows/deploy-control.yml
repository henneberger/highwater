name: Deploy control service

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/deploy-control.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile.control"
      - "crates/control/**"
      - "fly.control.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-highwater-control
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate Fly registry
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.control
          platforms: linux/amd64
          push: true
          tags: registry.fly.io/highwater-control:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy control service
        run: flyctl deploy --app highwater-control --config fly.control.toml --image registry.fly.io/highwater-control:${{ github.sha }} --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
