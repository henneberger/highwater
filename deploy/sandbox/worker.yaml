apiVersion: apps/v1
kind: Deployment
metadata:
  name: highwater-worker
  labels:
    app.kubernetes.io/name: highwater-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: highwater-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: highwater-worker
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: highwater-worker
      containers:
        - name: application
          image: highwater/application:BUILD_ID
          imagePullPolicy: IfNotPresent
          command: ["highwater-worker"]
          args:
            - "app"
            - "--process-only"
            - "--task-queue"
            - "APPLICATION_TASK_QUEUE"
            - "--target"
            - "http://highwater-core:7234"
          env:
            - name: HIGHWATER_EXECUTION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: highwater-worker-identity
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: highwater-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: highwater-worker
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: highwater-core
      ports:
        - protocol: TCP
          port: 7234
