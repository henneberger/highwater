app = "highwater-control"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.control"

[env]
  HIGHWATER_DATA_PLANE = "https://highwater-cloud.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
