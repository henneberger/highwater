app = "highwater-cloud"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  HIGHWATER_ADDRESS = "https://api.highwater.cloud"
  HIGHWATER_LIVE_INTERVAL = "15"
  PYTHONUNBUFFERED = "1"

[processes]
  app = "/usr/local/bin/highwater-cloud server"
  live_source = "/usr/local/bin/highwater-cloud live-source"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "2s"

[[mounts]]
  source = "highwater_data"
  destination = "/data"
  initial_size = "1gb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["live_source"]
